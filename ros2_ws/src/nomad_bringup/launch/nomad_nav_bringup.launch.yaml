launch:
  - arg:
      name: use_realsense
      default: 'true'
  - arg:
      name: camera_name
      default: 'camera'
  - arg:
      name: image_topic
      default: '/camera/color/image_raw'
  - arg:
      name: enable_depth
      default: 'false'
  - arg:
      name: color_profile
      default: '640x480x30'

  - arg:
      name: model
      default: 'nomad'
  - arg:
      name: topomap_dir
      default: 'topomap'
  - arg:
      name: goal_node
      default: '-1'
  - arg:
      name: waypoint
      default: '2'
  - arg:
      name: close_threshold
      default: '3'
  - arg:
      name: radius
      default: '4'
  - arg:
      name: num_samples
      default: '8'
  - arg:
      name: cmd_vel_topic
      default: '/cmd_vel'
  - arg:
      name: enable_teleop
      default: 'false'

  - include:
      if: '$(var use_realsense)'
      file: '$(find-pkg-share realsense2_camera)/launch/rs_launch.py'
      arg:
        - {name: camera_name, value: '$(var camera_name)'}
        - {name: enable_color, value: 'true'}
        - {name: enable_depth, value: '$(var enable_depth)'}
        - {name: rgb_camera.color_profile, value: '$(var color_profile)'}

  - node:
      pkg: nomad_nav
      exec: navigate
      output: screen
      remap:
        - {from: '/rgb', to: '$(var image_topic)'}
      args: '--model $(var model) --dir $(var topomap_dir) --goal-node $(var goal_node) --waypoint $(var waypoint) --close-threshold $(var close_threshold) --radius $(var radius) --num-samples $(var num_samples)'

  - node:
      pkg: nomad_nav
      exec: pd_controller
      output: screen
      remap:
        - {from: '/cmd_vel', to: '$(var cmd_vel_topic)'}

  - node:
      if: '$(var enable_teleop)'
      pkg: teleop_twist_keyboard
      exec: teleop_twist_keyboard
      output: screen
      remap:
        - {from: '/cmd_vel', to: '$(var cmd_vel_topic)'}
